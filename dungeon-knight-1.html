<style>
:root{--bg:#0a0912;--fg:#f4f4f4;--ring:rgba(255,255,255,.55);--uw:1vw;--uh:1vh;--st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px)}

#hud{position:fixed;left:calc(12px + var(--sl));top:calc(8px + var(--st));pointer-events:none;font:13px/1.3 system-ui,sans-serif;text-shadow:0 1px 3px #000}

#dlg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,9,18,.6)}

#coins{top:calc(114px + var(--st))}

#bb{position:fixed;left:50%;top:calc(54px + var(--st));transform:translateX(-50%);width:min(calc(var(--uw)*46),320px);text-align:center;display:none;font:600 12px system-ui,sans-serif;text-shadow:0 1px 3px #000;pointer-events:none}

body.menu #jb,body.menu #jk,body.menu #h,body.menu #hud,body.menu #coins,body.menu #fl,body.menu #bb,body.menu #swap,body.menu #skill,body.menu #pause,body.menu #pm,body.menu #fire,body.menu #mm,body.menu #toast{display:none!important}

.logo{font:900 clamp(36px,min(calc(var(--uw)*17),calc(var(--uh)*15)),88px)/.95 ui-monospace,Menlo,Consolas,"Courier New",monospace;letter-spacing:.06em;color:#ffcd75;text-shadow:0 3px 0 #b4813d,0 6px 0 #4a2c22,0 0 28px rgba(255,160,70,.55)}

.bt.pri{background:#ffcd75;border-color:#fff1c4;color:#1a1c2c;box-shadow:0 4px 0 #b4813d}

.bt.big{margin-top:26px;padding:14px 52px;font-size:20px;letter-spacing:.1em;text-transform:uppercase;animation:pls 1.6s ease-in-out infinite}

#di{display:none;margin:0 auto 8px;height:auto;image-rendering:pixelated}
#wn{display:flex;gap:6px;margin-top:6px}
.ws{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:50px;padding:3px 6px 2px;border-radius:7px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);opacity:.6}

#fire{transition:background .08s,border-color .08s}

#bcfg{margin-top:12px}
#lb,#cf{gap:12px}

#slots{display:flex;flex-direction:column;gap:8px}

.slot.on{border-color:#ffcd75;box-shadow:0 0 12px rgba(255,205,117,.45)}
.slot.lk{opacity:.5;border-style:dashed}
.slot.lk b{font:800 22px/32px system-ui,sans-serif;color:#8a86b0}
.card{padding:12px 14px;border-radius:14px;background:rgba(29,25,48,.88);border:2px solid #5c4f78}

#sd{margin:0 0 8px;font-size:12px;color:#cfc8e6}

.v{display:flex;align-items:center;gap:8px}

.hr{color:#ff5a6e;font-size:18px;letter-spacing:2px;line-height:1}
.sg{display:flex;gap:3px}

.mb{width:96px;height:8px;border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.45)}

.wp{display:flex;gap:8px;align-items:flex-start;margin-top:5px}

.acts{display:flex;gap:12px}

@keyframes hf{from{opacity:1}to{opacity:0}}
#os{font:500 15px/1.6 system-ui,sans-serif;text-align:center;color:#cfc8e6}
#dc.pk button{display:block;width:100%;margin:7px 0;background:#3a3354!important;color:var(--fg)!important;border:1px solid #8a86b0}
#ps{font-size:15px;letter-spacing:3px;margin-top:3px}
#skill{right:calc(126px + var(--sr));bottom:calc(98px + var(--sb));width:66px;height:66px;--p:0}
#skill svg{width:56%;height:56%;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.85))}
#skill::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(rgba(10,9,18,.74) calc(var(--p)*1turn),transparent 0)}
#skill.rdy{border-color:#ffcd75;box-shadow:0 0 12px rgba(255,205,117,.6)}
#dc.pk{max-width:min(calc(var(--uw)*92),430px)}
#dc.pk button{text-align:left;padding:8px 12px}
#dc.pk button b{display:block;font-size:15px}

#pause{right:calc(198px + var(--sr));top:calc(8px + var(--st));width:38px;height:38px}
.pi{image-rendering:pixelated;margin-right:3px;vertical-align:middle}
#dc.pk button{display:flex;gap:10px;align-items:center}
#pm{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:7;background:rgba(10,9,18,.8);font:14px/1.35 system-ui,sans-serif;padding:max(8px,var(--st)) max(10px,var(--sr)) max(8px,var(--sb)) max(10px,var(--sl));box-sizing:border-box}

#pmg{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:6px 0}
.pa{aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:0;border-radius:8px;border:2px solid #3a3354;background:rgba(29,25,48,.8)}

</style>
</head>

function buildMap(){
  const c=document.createElement('canvas');c.width=W*T;c.height=H*T;
  const g=c.getContext('2d');g.imageSmoothingEnabled=false;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    let i;
    if(wall(x,y))i=wall(x,y+1)?7:6;
    else{
      const h=Math.abs((x*73856093)^(y*19349663))%11;
      i=h===0?2:h<5?1:0;
      if(wall(x,y-1))i+=3;
    }
    g.drawImage(ATL,i*T,0,T,T,x*T,y*T,T,T);
    if(wall(x,y)&&wall(x,y+1)){
      g.fillStyle='#5c4f78';
      if(!wall(x,y-1))g.fillRect(x*T,y*T,T,2);
      if(!wall(x-1,y))g.fillRect(x*T,y*T,2,T);
      if(!wall(x+1,y))g.fillRect(x*T+T-2,y*T,2,T);
    }
  }
  return c;
}

const P={x:0,y:0,face:0,flip:false,step:0,at:0,mv:false},cam={x:0,y:0},CYC=[0,1,0,2],keys={};
addEventListener('keydown',e=>keys[e.code]=1);
addEventListener('keyup',e=>keys[e.code]=0);

function dirInput(){
  const x=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  const y=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(x||y){const l=Math.hypot(x,y);return[x/l,y/l]}
  const l=Math.hypot(jd.x,jd.y);
  if(l<.12)return[0,0];
  const k=Math.min(1,l/.8)/l; // velocidade máxima com 80% do joystick
  return[jd.x*k,jd.y*k];
}
function move(dx,dy){if(!hits(P.x+dx,P.y))P.x+=dx;if(!hits(P.x,P.y+dy))P.y+=dy}
function anim(d,dt){
  const mv=d[0]||d[1];
  if(mv){
    const ax=Math.abs(d[0]),ay=Math.abs(d[1]);
    if(ax>ay*1.2){P.face=2;P.flip=d[0]<0}else if(ay>ax*1.2){P.face=d[1]>0?0:1;P.flip=false}
    if(!P.mv){P.step=1;P.at=0}
    P.at+=dt;if(P.at>=.13){P.at-=.13;P.step=(P.step+1)%4}
  }else P.step=0;
  P.mv=!!mv;
}

function joyMove(e){
  const q=pt(e);let dx=q.x-jc.x,dy=q.y-jc.y;const l=Math.hypot(dx,dy);
  if(l>RAD){dx*=RAD/l;dy*=RAD/l;if(CFG.joy==='semi')jc={x:q.x-dx,y:q.y-dy}} // semi-fixo: a base acompanha o dedo; fixo: só o botão fica preso na borda
  jd={x:dx/RAD,y:dy/RAD};put(jb,jc,1);put(jk,{x:jc.x+dx,y:jc.y+dy},1);
}
addEventListener('pointerdown',e=>{
  if(scene!=='game'||jid!==null||paused)return;
  if(CFG.joy==='fixed'){
    const b=idlePos();if(Math.hypot(pt(e).x-b.x,pt(e).y-b.y)>RAD*1.7)return; // área de toque um pouco maior que a base
    jid=e.pointerId;jc=b;jd={x:0,y:0};joyMove(e);
  }else if(pt(e).x<_sw/2){jid=e.pointerId;jc=pt(e);jd={x:0,y:0};put(jb,jc,1);put(jk,jc,1)}
});

function lamp(x,y,r,c,e){
  if(x<-r||y<-r||x>vw+r||y>VH+r)return;
  const a=c.map(v=>Math.min(255,v*e|0)),g=L.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${a},1)`);g.addColorStop(.5,`rgba(${a},.3)`);g.addColorStop(1,`rgba(${a},0)`);
  L.fillStyle=g;L.fillRect(x-r,y-r,2*r,2*r);
}
function draw(t){
  const g=ctx;g.imageSmoothingEnabled=false;
  const cx=Math.round(Math.max(0,Math.min(W*T-vw,cam.x-vw/2)));
  const cy=Math.round(Math.max(0,Math.min(H*T-VH,cam.y-VH/2)));
  g.fillStyle='#0a0912';g.fillRect(0,0,vw,VH);
  g.drawImage(MAPC,-cx,-cy);
  torches.forEach(([x,y],i)=>g.drawImage(TORI,(Math.floor(t*6+i*1.7)%2)*16,0,16,16,x*T-cx,y*T-cy,16,16));
  drawBelow(g,cx,cy,t);
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(P.x-cx,P.y+7-cy,6.5,3,0,0,7);g.fill();
  TR.forEach(o=>{g.save();g.globalAlpha=Math.min(1,o.t*2);g.translate(Math.round(o.x-cx),Math.round(o.y-cy-1));if(o.fl)g.scale(-1,1);g.drawImage(IMG.knight,16,o.f*16,16,16,-8,-8,16,16);g.restore()});
  if(hv('aura')){g.strokeStyle='rgba(255,150,70,.4)';g.lineWidth=1;g.beginPath();g.arc(P.x-cx,P.y-cy,34,0,7);g.stroke()}
  g.save();g.translate(Math.round(P.x-cx),Math.round(P.y-cy-1));if(P.flip)g.scale(-1,1);
  g.drawImage(IMG.knight,(P.mv?CYC[P.step]:0)*16,P.face*16,16,16,-8,-8,16,16);g.restore();
  drawAbove(g,cx,cy,t);
  // penumbra + luzes (cena x (ambiente + luzes), como o CanvasModulate do Godot)
  L.globalCompositeOperation='source-over';L.fillStyle=AMBC;L.fillRect(0,0,vw,VH);
  L.globalCompositeOperation='lighter';
  lamp(P.x-cx,P.y-cy,109,[255,217,153],.95+.06*Math.sin(t*11)+.04*Math.sin(t*23));
  torches.forEach(([x,y],i)=>lamp(x*T+8-cx,y*T+22-cy,83,TLC,1.1+.12*Math.sin(t*9+i*2.3)+.08*Math.sin(t*17+i)));
  extraLamps(cx,cy,t);
  g.globalCompositeOperation='multiply';g.drawImage(LC,0,0);g.globalCompositeOperation='source-over';
}

function mk(rows,pal){ // sprite pixel art a partir de texto, com contorno automático
  const h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w+2;c.height=h+2;
  const g=c.getContext('2d'),at=(x,y)=>!!(rows[y]&&rows[y][x]&&rows[y][x]!=='.');
  for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){
    if(at(x,y)){g.fillStyle=pal[rows[y][x]];g.fillRect(x+1,y+1,1,1)}
    else if(at(x+1,y)||at(x-1,y)||at(x,y+1)||at(x,y-1)){g.fillStyle='#1a1c2c';g.fillRect(x+1,y+1,1,1)}
  }
  return c;
}

function hitC(cx,cy,r){
  for(let ty=Math.floor((cy-r)/T);ty<=Math.floor((cy+r)/T);ty++)
    for(let tx=Math.floor((cx-r)/T);tx<=Math.floor((cx+r)/T);tx++)
      if(solid(tx,ty)){
        const nx=Math.max(tx*T,Math.min(cx,tx*T+T)),ny=Math.max(ty*T,Math.min(cy,ty*T+T));
        if((cx-nx)**2+(cy-ny)**2<r*r)return true;
      }
  return false;
}
const hits=(px,py)=>hitC(px,py+4,R);
function stepE(o,dx,dy,r){if(!hitC(o.x+dx,o.y,r))o.x+=dx;if(!hitC(o.x,o.y+dy,r))o.y+=dy}

function spawn(r,w){
  let sp=[];
  for(let y=r.y0+1;y<r.y1;y++)for(let x=r.x0+1;x<r.x1;x++)
    if(!wall(x,y))sp.push([x*T+8,y*T+8,Math.hypot(x*T+8-P.x,y*T+8-P.y)]);
  const far=sp.filter(p=>p[2]>90);
  sp=far.length>=8?far:sp.sort((a,c)=>c[2]-a[2]).slice(0,Math.max(10,sp.length>>2)); // sala pequena: usa os cantos mais distantes
  const [ns,nk]=r.waves[w];
  [['slime',ns],['skel',nk]].forEach(([k,n])=>{for(let i=0;i<n&&sp.length;i++){
    const [x,y]=sp.splice(Math.random()*sp.length|0,1)[0];
    EN.push({k,x,y,hp:Math.round(TY[k].hp*(1+LV*.1)),t:.8,cd:1+Math.random(),fl:0,vx:0,vy:0,s:Math.random()<.5?-1:1})}});
}
function rooms(){
  const tx=P.x/T|0,ty=P.y/T|0;
  ROOMS.forEach(r=>{
    if(!r.waves)return;
    const inside=tx>r.x0&&tx<r.x1&&ty>r.y0&&ty<r.y1;
    if(r.st===0&&inside){r.st=1;r.w=0;lock(r,1);snd('lock');
      if(r.type==='boss'){spawnBoss(r);toast('Chefe: '+ZN[ZONE-1].boss+'!')}
      else{spawn(r,0);toast('A sala trancou! Elimine todos os monstros')}}
    else if(r.st===1&&!EN.length){
      if(r.type!=='boss'&&++r.w<r.waves.length)spawn(r,r.w);
      else{r.st=2;lock(r,0);snd('clear');ST.r++;const cx=(r.x0+r.x1+1)/2*T,cy=(r.y0+r.y1+1)/2*T;
        if(r.type==='boss'){CHS.push({x:cx-30,y:cy,kind:'weapon'});PT={x:cx+10,y:cy,away:false};toast('Chefe derrotado! O portal se abriu')}
        else if(r.final){CHS.push({x:cx-26,y:cy,kind:'loot'});PT={x:cx+26,y:cy,away:false};toast('Sala final limpa! O portal se abriu')}
        else{CHS.push({x:(r.x0+r.x1)/2*T+8,y:(r.y0+r.y1)/2*T+8,kind:'loot'});toast('Sala limpa! Pegue o baú')}}
    }
  });
}
function dmgE(e,d,kx,ky){

  if(e.hp<=0){e.dead=true;ST.k++;EN.splice(EN.indexOf(e),1);FX.push({x:e.x,y:e.y,r:e.k==='boss'?40:10,t:.3});deathFx(e);
    if(e.k==='boss'){drop(e.x,e.y,'coin',1,18);drop(e.x,e.y,'mana',15,3);EN.splice(0).forEach(m=>FX.push({x:m.x,y:m.y,r:10,t:.3}))}
    else{if(Math.random()<(hv('magnet')?.65:.4))drop(e.x,e.y,'coin',1,1);if(Math.random()<.1)drop(e.x,e.y,'mana',8,1)}}
}

}

    if((l&&!bl)||(l===bl&&d<best)){best=d;bl=l;a=Math.atan2(e.y-P.y,e.x-P.x)}}
  en-=w.cost;cd=w.cd*PM.c*(1-.08*FR.n);aim=a;faceTo(a);snd(loadout[sel]);
  if(w.k==='x'){const s=best<190?Math.min(best,110):70;BM.push({x:P.x,y:P.y,vx:Math.cos(a)*s*3.4,vy:Math.sin(a)*s*3.4,t:.7});return}
  const rp=hv('dbl')&&Math.random()<.25?2:1;for(let i=0;i<w.n1*rp;i++){const b=a+(Math.random()-.5)*w.spr,cr=hv('crit')&&Math.random()<.2;
    PB.push({x:P.x,y:P.y,vx:Math.cos(b)*w.sp,vy:Math.sin(b)*w.sp,life:w.life,dmg:w.dmg*PM.d*(cr?2:1),pi:(w.pierce||1)+(hv('pierce')?1:0),bn:hv('bounce')?1:0,hm:hv('home'),col:cr?'#ff6a6a':w.col,orb:w.k==='o',hit:new Set()})}
}
function los(x0,y0,x1,y1){const dx=x1-x0,dy=y1-y0,n=Math.ceil(Math.hypot(dx,dy)/6);for(let i=1;i<n;i++)if(hitC(x0+dx*i/n,y0+dy*i/n,1.5))return false;return true}
function updEn(e,dt){
  if(e.k==='boss')return updBoss(e,dt);
  if(e.t>0){e.t-=dt;return}
  e.fl=Math.max(0,e.fl-dt);e.sd=Math.max(0,(e.sd||0)-dt);
  const ty=TY[e.k],dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;let mx=ux,my=uy,chase=true;
  if(e.k==='skel'&&los(e.x,e.y,P.x,P.y)){ // caveira só mantém distância e atira quando enxerga o jogador
    if(d<70){mx=-ux;my=-uy;chase=false}else if(d<110){mx=-uy*e.s;my=ux*e.s;chase=false}
    e.cd-=dt;if(e.cd<=0){e.cd=1.7;EB.push({x:e.x,y:e.y,vx:ux*(85+LV*2),vy:uy*(85+LV*2),life:3})}
  }
  if(e.sd>0){mx=-uy*e.s;my=ux*e.s;chase=false} // empacou num pilar ou canto: anda de lado para contornar
  const ix=(mx*ty.sp+e.vx)*dt,iy=(my*ty.sp+e.vy)*dt,want=Math.hypot(ix,iy);
  stepE(e,ix,iy,ty.r);
  const prog=d-Math.hypot(P.x-e.x,P.y-e.y);
  e.bl=chase&&want>.01&&prog<want*.25?(e.bl||0)+dt:0;
  if(e.bl>.4){e.s=-e.s;e.sd=.8;e.bl=0}
  const k=Math.exp(-8*dt);e.vx*=k;e.vy*=k;
  if(e.k==='slime'&&d<ty.r+5)hurt(1);
}

  for(let i=PB.length-1;i>=0;i--){
    const b=PB[i];
    if(b.hm){let tg=null,bd=110;for(const e of EN)if(e.t<=0&&!b.hit.has(e)){const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<bd){bd=d;tg=e}}
      if(tg){const v=Math.hypot(b.vx,b.vy),ca=Math.atan2(b.vy,b.vx);let df=Math.atan2(tg.y-b.y,tg.x-b.x)-ca;df=Math.atan2(Math.sin(df),Math.cos(df));

    $('wn').innerHTML=loadout.map((k,i)=>`<span class="ws${i===sel?' on':''}"><img src="${WSU[k]}" style="width:${WS[k].width*2}px" alt=""><i>${WP[k].nm}</i></span>`).join('');
    $('mn').textContent=Math.round(en);$('coins').textContent=coins;$('swap').style.opacity=loadout.length<2?.35:1;}

// ---- andares aleatórios, 3 etapas com tema, chefes e portal
const SW=22,SH=16,GC=4,GR=3,BH=[80,140,220],rn=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function mkWaves(first,final){
  const nw=first?(LV>6?2:1):(final?3:2)+(LV>9?1:0),w=[];
  for(let i=0;i<nw;i++){
    const tot=Math.min(10,Math.round(2.5+LV*.28+i*1.1+(final?1.5:0)+Math.random()*1.5)),
      sk=Math.min(tot-1,Math.round(tot*Math.min(.45,.12+LV*.03)));

// Gera um andar: grade 4x3 de "slots"; início → 1ª batalha fixa → (sala especial | outras batalhas) → sala final com portal.
function genFloor(){
  for(let tries=0;tries<300;tries++){
    const cs=[],at=(c,r)=>cs.find(q=>q.c===c&&q.r===r),free=(c,r)=>c>=0&&r>=0&&c<GC&&r<GR&&!at(c,r);
    const nbs=q=>[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[q.c+a,q.r+b]).filter(([c,r])=>free(c,r));
    const add=(c,r,type,par,dep)=>{const q={c,r,type,par,dep};cs.push(q);return q};
    const pick=a=>a[Math.random()*a.length|0];
    const st=add(FLOOR===5?0:rn(0,GC-1),rn(0,GR-1),'start',null,0);
    if(FLOOR===5){const sp=add(1,st.r,'special',st,1);add(2,st.r,'boss',sp,2)}
    else{
      const n1=nbs(st);if(!n1.length)continue;
      const b1=add(...pick(n1),'fight',st,1);b1.first=true;
      const n2=nbs(b1);if(!n2.length)continue;
      add(...pick(n2),'special',b1,2);
      const target=rn(6,8)+(LV>9?1:0);
      for(let g=0;cs.length<target&&g<80;g++){
        const cand=cs.filter(q=>q.type==='fight'&&nbs(q).length);if(!cand.length)break;
        const q=pick(cand),[c,r]=pick(nbs(q));add(c,r,'fight',q,q.dep+1);
      }
      const fs=cs.filter(q=>q.type==='fight'&&!q.first);if(cs.length<5||!fs.length)continue;
      const dm=Math.max(...fs.map(q=>q.dep));pick(fs.filter(q=>q.dep===dm)).final=true;
    }
    const G=Array.from({length:GR*SH},()=>Array(GC*SW).fill('#')),
      carve=(x0,y0,x1,y1,ch='.')=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)G[y][x]=ch};
    cs.forEach(q=>{
      const [w,h]={start:[9,7],special:[9,7],boss:[18,12]}[q.type]||[rn(11,14),rn(8,11)],j=q.type==='boss'?0:1;
      q.x0=Math.max(2,Math.floor(q.c*SW+SW/2-w/2)+rn(-j,j));q.y0=Math.max(2,Math.floor(q.r*SH+SH/2-h/2)+rn(-j,j));
      q.x1=q.x0+w-1;q.y1=q.y0+h-1;carve(q.x0,q.y0,q.x1,q.y1);
    });
    const lk=[];
    cs.forEach((q,i)=>{if(!q.par)return;const p=q.par,pi=cs.indexOf(p);
      if(p.r===q.r){const [a,b]=p.c<q.c?[p,q]:[q,p],cy=a.r*SH+SH/2-1;carve(a.x1+1,cy,b.x0-1,cy+1);lk.push([pi,i,a.x1+1,cy,b.x0-1,cy+1])}
      else{const [a,b]=p.r<q.r?[p,q]:[q,p],cx=a.c*SW+SW/2-1;carve(cx,a.y1+1,cx+1,b.y0-1);lk.push([pi,i,cx,a.y1+1,cx+1,b.y0-1])}
    });
    const ctr=cs.map(q=>[Math.floor((q.x0+q.x1)/2),Math.floor((q.y0+q.y1)/2)]),seen=new Set([ctr[0].join()]),stack=[ctr[0]];
    while(stack.length){const [x,y]=stack.pop();for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const k=(x+a)+','+(y+b);if(!seen.has(k)&&G[y+b]&&G[y+b][x+a]==='.'){seen.add(k);stack.push([x+a,y+b])}}}
    if(!ctr.every(p=>seen.has(p.join())))continue; // todas as salas precisam estar ligadas
    cs.forEach(q=>{
      const cx=(q.x0+q.x1)/2,cy=(q.y0+q.y1)/2;
      if(q.type==='fight')for(let k=rn(0,3);k>0;k--){ // pilares, sempre longe do centro (onde ficam baú e portal)
        const px=rn(q.x0+3,q.x1-4),py=rn(q.y0+3,q.y1-4);
        if(Math.abs(px+1-cx)>4||Math.abs(py+1-cy)>4)carve(px,py,px+1,py+1,'#');
      }
      for(let n=rn(2,3),k=0;k<14&&n>0;k++){ // tochas na parede norte
        const x=rn(q.x0+1,q.x1-1),y=q.y0-1;
        if(G[y][x]==='#'&&G[y+1][x]==='.'&&G[y][x-1]!=='T'&&G[y][x+1]!=='T'){G[y][x]='T';n--}
      }
    });
    G[ctr[0][1]][ctr[0][0]]='P';
    const rooms=cs.map(q=>({x0:q.x0,y0:q.y0,x1:q.x1,y1:q.y1,type:q.type,first:q.first,final:q.final,
      waves:q.type==='fight'?mkWaves(q.first,q.final):q.type==='boss'?[]:undefined}));
    return{MAP:G.map(r=>r.join('')),rooms,LK:lk};
  }
  throw new Error('genFloor falhou');
}

const lerp3=(S,t)=>{const a=t<.5?S[0]:S[1],b=t<.5?S[1]:S[2],k=t<.5?t*2:(t-.5)*2;return a.map((v,i)=>v+(b[i]-v)*k)};
function recolor(src,fl,wl){
  if(!fl)return src;
  const c=document.createElement('canvas');c.width=src.width;c.height=src.height;
  const g=c.getContext('2d');g.drawImage(src,0,0);
  const id=g.getImageData(0,0,c.width,c.height),d=id.data,hx=a=>a.map(h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16))),F=hx(fl),Wl=hx(wl);
  for(let x=0;x<c.width;x++)for(let y=0;y<c.height;y++){
    const i=(y*c.width+x)*4;if(!d[i+3])continue;
    const l=(.3*d[i]+.59*d[i+1]+.11*d[i+2])/255,o=lerp3(x<6*T?F:Wl,Math.min(1,l/.6));d[i]=o[0];d[i+1]=o[1];d[i+2]=o[2];
  }

}

  if(AU.c.state==='suspended')AU.c.resume();return AU.c;
}
function applySnd(){if(AU.m)AU.m.gain.setTargetAtTime(CFG.snd?.6:0,AU.c.currentTime,.03)}
function tn(f,t,d,ty,v,f2,dst){ // nota: freq, início, duração, onda, volume, freq final, destino
  const c=AU.c,o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dst||AU.fx);o.start(t);o.stop(t+d+.02);
}
function nz(t,d,v,fq,dst,ty){ // ruído filtrado (tiros, explosões, bateria)
  const c=AU.c,b=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();b.buffer=AU.nb;b.loop=true;f.type=ty||'lowpass';f.frequency.value=fq;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);b.connect(f);f.connect(g);g.connect(dst||AU.fx);b.start(t,Math.random()*.5);b.stop(t+d+.02);
}
const SFX={
 pistol:t=>{tn(900,t,.12,'square',.16,200);nz(t,.05,.1,5000)},
 smg:t=>tn(1100,t,.06,'square',.09,350),
 shotgun:t=>{nz(t,.25,.35,2500);tn(160,t,.2,'sawtooth',.2,50)},
 staff:t=>{tn(380,t,.3,'sine',.2,1100);tn(570,t,.3,'triangle',.1,1500)},
 bomb:t=>tn(300,t,.15,'triangle',.2,120),
 boom:t=>{nz(t,.5,.6,900);tn(110,t,.4,'sawtooth',.3,30)},
 hit:t=>{tn(260,t,.05,'square',.1,120);nz(t,.04,.12,3000)},
 kill:t=>{tn(420,t,.18,'square',.14,60);nz(t,.15,.2,2000)},
 hurt:t=>{tn(220,t,.3,'sawtooth',.25,55);nz(t,.2,.3,1200)},
 coin:t=>{tn(1319,t,.07,'square',.1);tn(1760,t+.06,.14,'square',.1)},
 mana:t=>tn(600,t,.18,'sine',.18,1200),
 heart:t=>{tn(523,t,.1,'triangle',.2);tn(784,t+.08,.18,'triangle',.2)},
 chest:t=>[523,659,784,1047].forEach((f,i)=>tn(f,t+i*.07,.2,'square',.1)),
 equip:t=>[392,523,659,784].forEach((f,i)=>tn(f,t+i*.06,.18,'triangle',.18)),
 buy:t=>{tn(988,t,.08,'square',.1);tn(1319,t+.07,.2,'square',.1)},
 swap:t=>tn(500,t,.05,'square',.08,700),
 empty:t=>tn(120,t,.15,'square',.1),
 lock:t=>{nz(t,.35,.4,500);tn(70,t,.3,'sine',.4,40)},
 clear:t=>[392,494,587,784].forEach((f,i)=>tn(f,t+i*.09,.3,'triangle',.2)),
 perk:t=>[659,880,1175,1568].forEach((f,i)=>tn(f,t+i*.05,.25,'sine',.15)),
 portal:t=>{tn(150,t,.9,'sawtooth',.12,900);tn(300,t,.9,'sine',.12,1800)},
 boss:t=>{tn(55,t,1.4,'sawtooth',.3,40);tn(58,t,1.4,'square',.15,38);nz(t,.8,.2,300)},
 bossdie:t=>{nz(t,1.2,.5,1500);tn(300,t,1.2,'sawtooth',.25,30)},
 die:t=>[440,392,330,262,196].forEach((f,i)=>tn(f,t+i*.2,.5,'triangle',.22)),
 win:t=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tn(f,t+i*.12,.35,'square',.12)),
 ui:t=>tn(700,t,.06,'square',.07,900),
 dash:t=>{nz(t,.25,.35,2500,null,'bandpass');tn(200,t,.2,'sawtooth',.12,800)},
 guard:t=>{tn(1000,t,.1,'triangle',.2);tn(1500,t+.07,.18,'triangle',.2)},
 ready:t=>tn(1250,t,.08,'sine',.08)
},GAP={smg:.05,hit:.04,kill:.05,coin:.03,mana:.05,heart:.05};
function snd(k){const c=CFG.snd&&ac();if(!c||!SFX[k])return;const n=c.currentTime;if(AU.last[k]&&n-AU.last[k]<(GAP[k]||0))return;AU.last[k]=n;SFX[k](n+.005)}
// música: baixo + arpejo + melodia + bateria; cada etapa tem escala e andamento próprios, e a cena muda a intensidade
const MU={
 menu:{b:72,r:57,s:[0,2,3,5,7,8,10],p:[0,5,2,6]},
 z0:{b:92,r:57,s:[0,2,3,5,7,8,10],p:[0,5,2,6]},  // Masmorra: lá menor
 z1:{b:100,r:62,s:[0,2,3,5,7,9,10],p:[0,3,5,4]}, // Caverna Gelada: ré dórico
 z2:{b:108,r:52,s:[0,1,3,5,7,8,10],p:[0,1,0,6]}  // Forja: mi frígio
},TEMPO=[.85,1,1.22,1.4];
function mstep(st,t){
  const p=MU[AU.z],I=AU.int,s=st&15,rt=p.p[(st>>4)&3],mu=AU.mu,sp=60/(p.b*TEMPO[I])/4,
    nt=d=>p.r+p.s[((d%7)+7)%7]+12*Math.floor(d/7),ch=[rt,rt+2,rt+4,rt+7];
  if(s%(I>=2?2:8)===0)tn(hz(nt(rt)-12),t,sp*(I>=2?1.8:7),'triangle',.5,0,mu);
  if(I>=2||s%2===0)tn(hz(nt(ch[(s>>(I>=2?0:1))%4])+12),t,sp*1.6,'square',.1,0,mu);
  if(s%2===0&&Math.random()<[.12,.25,.4,.5][I])tn(hz(nt(ch[Math.random()*4|0]+(Math.random()<.3?7:14))),t,sp*(2+Math.random()*2),I?'sawtooth':'triangle',.08,0,mu);
  if(I>=1){
    if(s%8===0||(I>=2&&s===10)||(I>=3&&s%4===0))tn(150,t,.12,'sine',.8,45,mu);
    if(I>=2&&(s===4||s===12))nz(t,.14,.3,2500,mu,'highpass');
    if(I>=2||s%2===1)nz(t,.03,.12,8000,mu,'highpass');
  }
}
function mtick(){
  const c=AU.c;if(!c||AU.stop||!CFG.snd)return;
  if(c.currentTime>AU.nx+.5)AU.nx=c.currentTime+.05; // voltou de uma aba em segundo plano
  while(AU.nx<c.currentTime+.2){
    AU.z=scene==='game'?'z'+(ZONE-1):'menu';
    AU.int=scene!=='game'?0:EN.some(e=>e.k==='boss'&&e.t<=0)?3:EN.some(e=>e.t<=0)?2:1;
    mstep(AU.st++,AU.nx);AU.nx+=60/(MU[AU.z].b*TEMPO[AU.int])/4;
  }
}
function start(){
  setInterval(mtick,40);['pointerdown','keydown'].forEach(n=>addEventListener(n,()=>ac(),{capture:true}));
  addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button'))snd('ui')});
  document.addEventListener('visibilitychange',()=>{if(AU.c)document.hidden?AU.c.suspend():AU.c.resume()});
  fit();addEventListener('resize',fit);addEventListener('orientationchange',fit);
  initMenu();
  requestAnimationFrame(frame);
}
</script>
